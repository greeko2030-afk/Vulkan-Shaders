name: Build Vulkan Shaders Mod (Without Gradle Wrapper)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    # Install Vulkan SDK and standard Gradle on the Ubuntu runner
    - name: Install Vulkan SDK and Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y vulkan-tools libvulkan-dev glslang-tools gradle

    # Build the mod using system-wide Gradle instead of gradlew
    - name: Build with Gradle
      run: gradle build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
          name: VulkanMod-MC1.21-Jar
          path: build/libs/*.jar

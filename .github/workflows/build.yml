name: Build Vulkan Shaders Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    # (Optional) Install Vulkan SDK if you want to compile .glsl to .spv during the build process
    - name: Install Vulkan SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y vulkan-tools libvulkan-dev glslang-tools

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
          name: VulkanMod-MC1.21-Jar
          path: build/libs/*.jar
